{{ansible_managed|comment(decoration='#')}}

check process openssh with pidfile "/var/run/sshd.pid"
  start program = "/usr/sbin/rcctl start {{service_name_openssh}}"
  stop program = "/usr/sbin/rcctl stop {{service_name_openssh}}"
{% if not (openssh_port == []) %}
{% for item in openssh_port %}
  if failed host 127.0.0.1 port {{item|int(22)}} type tcp protocol ssh with timeout 3 seconds for 3 cycles then alert
{% endfor %}
{% else %}
  if failed host 127.0.0.1 port 22 type tcp protocol ssh with timeout 3 seconds for 3 cycles then alert
{% endif %}
  if does not exist for 3 cycles then alert
